# zz-p2p-gpu-unlock.conf — CachyOS-P2P-Nvidia gpu-unlock integration
# Installed by unlock-ga100.sh. Sorts AFTER the package's zz-gpu-unlock.conf
# and finalizes the early MODULES list so the unlock always wins the boot:
#
#   1. Removes the early nvidia stack (CachyOS chwd adds it for the early KMS
#      console). nvidia is blocked in the image below, so leaving it in the
#      list or letting udev autoload it (modalias) only creates a race where
#      nvidia grabs cards mid-unlock. nvidia loads normally after the root
#      switch and binds the already-unlocked cards.
#   2. Keeps exactly one plain 'gpu_unlock' entry. mkinitcpio's
#      systemd-initramfs writer dumps MODULES verbatim into the image, so a
#      trailing '?' optional marker makes the early loader look for a module
#      literally named 'gpu_unlock?' and fail.
#
# Trade-off: early boot shows the plain framebuffer until nvidia-drm loads
# after the root switch (no chwd early KMS console while this is installed).
_p2p_mods=()
for _p2p_m in "${MODULES[@]}"; do
    case "${_p2p_m%\?}" in
        nvidia|nvidia_modeset|nvidia_uvm|nvidia_drm) ;;
        gpu_unlock)
            [[ " ${_p2p_mods[*]:-} " == *" gpu_unlock "* ]] || _p2p_mods+=(gpu_unlock)
            ;;
        *) _p2p_mods+=("$_p2p_m") ;;
    esac
done
[[ " ${_p2p_mods[*]:-} " == *" gpu_unlock "* ]] || _p2p_mods+=(gpu_unlock)
MODULES=("${_p2p_mods[@]}")
unset _p2p_mods _p2p_m

# Block nvidia from loading inside the initramfs: both the modules-load
# service and udev autoload go through modprobe, which honors this directive.
# The file only exists inside the image — the root filesystem is untouched,
# so nvidia loads normally after the root switch.
printf 'install nvidia /bin/false\n' | add_file - /etc/modprobe.d/zz-gpu-unlock-noearly.conf 644
