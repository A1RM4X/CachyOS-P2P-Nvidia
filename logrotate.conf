# Rotate the nvidia-p2p logs so they don't grow without bound.
# Install to /etc/logrotate.d/nvidia-p2p (deployed by install.sh).
/var/log/nvidia-p2p-check.log
/var/log/nvidia-p2p-driver-rebuild.log
{
    weekly
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
